name: Android contribution checks
on:
  push:
    branches: [ci/android-contribution-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b5517eb318ed7e89c49869b6d4e265ba362c76ad
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Format and capture patch
        run: |
          cargo fmt --all
          git diff --binary --output=rustfmt.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rustfmt-patch
          path: rustfmt.patch
      - name: License headers and documentation links
        run: |
          bash scripts/check_license_headers.sh
          python3 scripts/check_doc_links.py
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --locked --workspace
      - name: C ABI smoke
        run: bash scripts/ffi_smoke.sh
