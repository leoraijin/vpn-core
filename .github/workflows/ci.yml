name: Android dual VPN native builds
on:
  push:
    branches: [codex/dual-vpn-routing-android-ci]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo install cargo-ndk --locked --version 3.5.4
      - name: Build and verify Android library
        env:
          ABI: ${{ matrix.abi }}
          RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cargo ndk -t "$ABI" -p 24 -o dist build --locked --release -p reality-ffi
          llvm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$llvm/llvm-strip" --strip-debug "dist/$ABI/libreality.so"
          "$llvm/llvm-readelf" -lW "dist/$ABI/libreality.so" | awk '/^[[:space:]]*LOAD / { n++; if ($NF != "0x4000") bad=1 } END { exit (n==0 || bad) }'
          sha256sum "dist/$ABI/libreality.so"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reality-android-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/libreality.so
          if-no-files-found: error
