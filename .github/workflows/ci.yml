name: Windows dual VPN validation
on:
  push:
    branches: [codex/dual-vpn-routing-windows-ci]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: clippy (код только для Windows)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: тесты
        run: cargo test --locked --workspace
      - name: сборка
        run: cargo build --locked --release -p reality-client
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reality-client-windows
          path: target/release/reality-client.exe
      - name: Two independent VPN exits
        run: python scripts/test_dual_exit_loopback.py target/release/reality-client.exe
      - name: служба и TUN на настоящей Windows
        shell: pwsh
        run: ./scripts/windows_live_test.ps1 -Exe target/release/reality-client.exe
      - name: Two application exits through Wintun
        shell: pwsh
        run: python scripts/test_dual_exit_loopback.py (Join-Path $env:RUNNER_TEMP 'rc-live/reality-client.exe') --windows-tun
