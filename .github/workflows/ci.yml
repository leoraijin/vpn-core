name: Reality Core two applications through Wintun
on:
  push:
    branches: [codex/dual-vpn-routing-wintun]
permissions:
  contents: read
  actions: read
jobs:
  wintun:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore exact release binary and signed Wintun
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'dual-wintun'
          gh run download 43249968054 --repo leoraijin/vpn-core --name reality-client-windows --dir $work
          if ($LASTEXITCODE -ne 0) { throw 'Core artifact download failed' }
          $exe = Join-Path $work 'reality-client.exe'
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          if ($actual -ne 'A9D809410C14731941CE0E78B255D23DA62C5801602D97BA3DCA8CABFB5050E0') { throw 'Wrong core artifact' }
          $zip = Join-Path $work 'wintun.zip'
          Invoke-WebRequest 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          Expand-Archive $zip -DestinationPath $work
          $dll = Join-Path $work 'wintun/bin/amd64/wintun.dll'
          $sig = Get-AuthenticodeSignature $dll
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'WireGuard LLC') { throw 'Wrong Wintun signer' }
          Copy-Item $dll (Join-Path $work 'wintun.dll')
      - name: Two application exits through Wintun
        shell: pwsh
        run: python scripts/test_dual_exit_loopback.py (Join-Path $env:RUNNER_TEMP 'dual-wintun/reality-client.exe') --windows-tun
