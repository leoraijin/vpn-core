name: Three exits through Wintun
on:
  push:
    branches: [codex/three-exits-wintun]
permissions:
  contents: read
jobs:
  wintun:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test the published Reality Core binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'nova-portable.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'nova-portable'
          Invoke-WebRequest 'https://github.com/leoraijin/NOVA-VPN/releases/download/v2.6.18/NOVA-VPN-Windows-2.6.18-Portable.zip' -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip).Hash -ne '20597311DD4BE90792B53FB0DD9E1A6F54F4327E032A44A1BD373C2D66037C6D') { throw 'Wrong archive' }
          Expand-Archive -LiteralPath $zip -DestinationPath $dest
          $core = Join-Path $dest 'core/reality-client.exe'
          if ((Get-FileHash -LiteralPath $core).Hash -ne 'B09C021DEE0FE46C9F023F05FE91E76116230E348E93DED1436E5E402FBCA31B') { throw 'Wrong core' }
          python scripts/test_dual_exit_loopback.py $core
          if ($LASTEXITCODE -ne 0) { throw 'Loopback fixture failed' }
          python scripts/test_dual_exit_loopback.py $core --windows-tun
          if ($LASTEXITCODE -ne 0) { throw 'Wintun fixture failed' }