name: UID routing validation (fork only)
on:
  push:
    branches: [ci/tun-uid-routing-validation]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 994ce4ef5792c23a0298db755db9561eea6726e2
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Format and save mechanical changes
        run: |
          cargo fmt --all
          git diff --binary > /tmp/uid-format.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: uid-format
          path: /tmp/uid-format.patch
      - name: Quick CI (fmt, SPDX, docs, clippy, workspace tests)
        run: bash scripts/ci.sh --quick
      - name: C ABI real smoke (unprivileged)
        if: ${{ !cancelled() }}
        run: bash scripts/ffi_smoke.sh
